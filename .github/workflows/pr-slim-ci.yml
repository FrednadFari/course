name: PR Slim CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  slim-ci:
    runs-on: ubuntu-latest
    environment: ci
    env:
      PR_SCHEMA: PR_${{ github.event.pull_request.number }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake

      - name: Write profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          default:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: "${SNOWFLAKE_ACCOUNT}"
                user: "${SNOWFLAKE_USER}"
                password: "${SNOWFLAKE_PASSWORD}"
                role: "${SNOWFLAKE_ROLE}"
                database: "${SNOWFLAKE_DATABASE}"
                warehouse: "${SNOWFLAKE_WAREHOUSE}"
                schema: "${PR_SCHEMA}"
                threads: 4
          EOF

      - name: dbt deps
        run: dbt deps
        env:
          DBT_PROFILES_DIR: /home/runner/.dbt

      - name: Download production manifest
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: prod-build.yml
          branch: main
          name: prod-manifest
          path: prod-artifacts
          if_no_artifact_found: warn

      - name: dbt build (state-based slim CI)
        run: |
          if [ -f prod-artifacts/manifest.json ]; then
            echo "Running slim CI against production state."
            dbt build --target ci --select "state:modified+" --defer --state prod-artifacts
          else
            echo "No production manifest found, running full build instead."
            dbt build --target ci
          fi
        env:
          DBT_PROFILES_DIR: /home/runner/.dbt
