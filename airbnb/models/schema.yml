# **test: dim_lisings_cleansed**
# listing_id has to be unique and not-null
# listing name not-null 
# room_type not_null, accpted_values 
# minimum_nights not_null
# host_id not_null, relashinship 
# price not_null 
# --------------------------------------------------------------
# **test: dim_hosts_cleansed**
# host_id unique, not_null
# host_name not_null
# is_superhost ** distinct >> t,f, null .
# create_at & update_at no need test
# --------------------------------------------------------------
# **test: fct_reviews
# listing_id: not_null, relashinship
# review_date not_null
# reviewer_name not_null
# review_text not_null
# review_sentiment accepted_values positeve, neutral, negative
# --------------------------------------------------------------
# DIM_LISTINGS_CLEANSED
# =====================
models:
  - name: dim_listings_cleansed
    description: Cleansed table which contains Airbnb listings.
    data_tests:
      - minimum_row_count:
          arguments:
            min_row_count: 1000
          severity: warn
    columns:
      - name: listing_id
        description: Pimary key for the lising.
        data_tests:
          - unique
          - not_null
      - name: listing_name
        data_tests:
          - not_null
      - name: room_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Entire home/apt', 'Private room', 'Hotel room', 'Shared room']
      - name: minimum_nights
        description: '{{ doc("dim_listing_cleansed_minimum_nights") }}'
        data_tests:
          - positive_values
      - name: host_id
        description: The hosts's id. Refereces the host table.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id
      - name: price
        data_tests: 
          - not_null



# --------------------------------------------------------------
# DIM_HOSTS_CLEANSED
# =====================
  - name: dim_hosts_cleansed
    versions:
      - v: 1
        defined_in: dim_hosts_cleansed
        deprecation_date: 2030-01-01
      - v: 2
        defined_in: dim_hosts_cleansed_v2
        columns:
          - include: '*'
            exclude: [host_name]
          - name: host_name
            description: The name of the host (N/A if not available)
            data_type: string
            constraints:
              - type: not_null
    latest_version: 2
    
    description: '{{ doc("dim_hosts_cleansed_overview") }}'
    columns:
      - name: host_id
        
        data_tests: 
          - unique
          - not_null
      - name: host_name
        data_tests:
          - not_null
      - name: is_superhost
        data_tests:
          - accepted_values:
              arguments:
                values: ['t', 'f']
              config:
                where: 'is_superhost IS NOT NULL'

# --------------------------------------------------------------
# FCT_REVIEWS
# =====================
  - name: fct_reviews
    columns:
      - name: listing_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_listings_cleansed')
                field: listing_id
      - name: review_date
        data_tests:
          - not_null
      - name: reviewer_name
        data_tests:
          - not_null
      - name: review_text
        data_tests:
          - not_null
      - name: review_sentiment
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['positive', 'neutral', 'negative']
# --------------------------------------------------------------
# DIM_LISTINGS_W_HOSTS
# --------------------------------------------------------------
  - name: dim_listings_w_hosts 
    data_tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          arguments:
            compare_model: source('airbnb', 'listings')
    columns:
      - name: price
        data_tests:
          - dbt_expectations.expect_column_quantile_values_to_be_between:
              arguments:
                quantile: .99
                min_value: 300
                max_value: 400
          - dbt_expectations.expect_column_max_to_be_between:
              arguments:
                # min_value: 1 # (Optional)
                max_value: 5000
                config: # let just get warn rather than an error 
                  severity: warn
          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments:
                column_type: number
                   # (Optional)
                # group_by: [group_id, other_group_id, ...] # (Optional)
                # row_condition: "id is not null" # (Optional)
                # strictly: false # (Optional. Default is 'false'. Adds an 'or equal to' to the comparison operator for min/max)

          # - dbt_expectations.expect_column_quantile_values_to_be_between:
          #     arguments:
          #       quantile: .95
          #       min_value: 100
          #       max_value: 160

        # compare_model: ref("other_model")
        # group_by: [col1, col2] # (Optional)
        # compare_group_by: [col1, col2] # (Optional)
        # factor: 1 # (Optional)
        # row_condition: "id is not null" # (Optional)
        # compare_row_condition: "id is not null" # (Optional)

